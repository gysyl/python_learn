<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图书馆藏 | Book Collection</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Source+Sans+Pro:wght@300;400;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --navy: #1a1a2e;
            --gold: #d4a373;
            --cream: #fefae0;
            --dark-cream: #e9e5d6;
            --shadow: rgba(26, 26, 46, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Source Sans Pro', sans-serif;
            background: linear-gradient(135deg, var(--cream) 0%, var(--dark-cream) 100%);
            min-height: 100vh;
            color: var(--navy);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 60px 24px;
        }

        /* Header */
        header {
            text-align: center;
            margin-bottom: 60px;
            animation: fadeInDown 0.8s ease-out;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3.5rem;
            font-weight: 700;
            color: var(--navy);
            letter-spacing: 2px;
            margin-bottom: 12px;
        }

        .subtitle {
            font-size: 1.1rem;
            color: var(--gold);
            font-weight: 300;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .divider {
            width: 80px;
            height: 3px;
            background: var(--gold);
            margin: 24px auto;
        }

        /* Stats Bar */
        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 48px;
            margin-bottom: 48px;
            animation: fadeIn 1s ease-out 0.3s both;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            font-weight: 600;
            color: var(--gold);
        }

        .stat-label {
            font-size: 0.9rem;
            color: var(--navy);
            opacity: 0.7;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Action Button */
        .add-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--navy);
            color: var(--cream);
            padding: 14px 28px;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 1px;
            border-radius: 4px;
            transition: all 0.3s ease;
            margin-bottom: 48px;
        }

        .add-btn:hover {
            background: var(--gold);
            color: var(--navy);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px var(--shadow);
        }

        /* Book Grid */
        .book-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 32px;
        }

        .book-card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 20px var(--shadow);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            animation: fadeInUp 0.6s ease-out both;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .book-card:nth-child(1) {
            animation-delay: 0.1s;
        }

        .book-card:nth-child(2) {
            animation-delay: 0.2s;
        }

        .book-card:nth-child(3) {
            animation-delay: 0.3s;
        }

        .book-card:nth-child(4) {
            animation-delay: 0.4s;
        }

        .book-card:nth-child(5) {
            animation-delay: 0.5s;
        }

        .book-card:nth-child(6) {
            animation-delay: 0.6s;
        }

        .book-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 16px 40px var(--shadow);
        }

        .book-header {
            background: var(--navy);
            padding: 24px;
            position: relative;
            overflow: hidden;
        }

        .book-header::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 100%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(212, 163, 115, 0.1), transparent);
            transform: rotate(45deg);
            transition: all 0.6s;
        }

        .book-card:hover .book-header::before {
            right: 150%;
        }

        .book-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.4rem;
            font-weight: 600;
            color: var(--cream);
            line-height: 1.4;
        }

        .book-body {
            padding: 24px;
        }

        .book-author {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--navy);
            opacity: 0.8;
            margin-bottom: 16px;
        }

        .book-author::before {
            content: '✍';
            font-size: 1rem;
        }

        .book-price {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--gold);
        }

        .book-price::before {
            content: '¥';
            font-size: 1rem;
            margin-right: 4px;
        }

        .book-actions {
            display: flex;
            gap: 12px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid var(--dark-cream);
        }

        .action-link {
            flex: 1;
            text-align: center;
            padding: 10px 16px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        .action-edit {
            background: var(--dark-cream);
            color: var(--navy);
        }

        .action-edit:hover {
            background: var(--gold);
            color: var(--navy);
        }

        .action-delete {
            background: transparent;
            color: #c44536;
            border: 1px solid #c44536;
        }

        .action-delete:hover {
            background: #c44536;
            color: white;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 80px 24px;
            animation: fadeIn 0.8s ease-out;
        }

        .empty-icon {
            font-size: 4rem;
            margin-bottom: 24px;
        }

        .empty-text {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            color: var(--navy);
            opacity: 0.6;
        }

        /* Footer */
        footer {
            text-align: center;
            margin-top: 80px;
            padding-top: 32px;
            border-top: 1px solid var(--dark-cream);
            opacity: 0.6;
            font-size: 0.9rem;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>图书馆藏</h1>
            <p class="subtitle">Book Collection</p>
            <div class="divider"></div>
        </header>

        <div class="stats-bar">
            <div class="stat-item">
                <div class="stat-number">{{ books|length }}</div>
                <div class="stat-label">藏书总数</div>
            </div>
        </div>

        <div style="text-align: center;">
            <a href="/books/add/" class="add-btn">
                <span>+</span> 添加新书
            </a>
        </div>

        {% if books %}
        <div class="book-grid">
            {% for book in books %}
            <div class="book-card">
                <div class="book-header">
                    <h2 class="book-title">{{ book.name }}</h2>
                </div>
                <div class="book-body">
                    <p class="book-author">{{ book.author }}</p>
                    <p class="book-price">{{ book.price }}</p>
                    <div class="book-actions">
                        <a href="/books/edit/{{ book.id }}/" class="action-link action-edit">编辑</a>
                        <a href="/books/delete/{{ book.id }}/" class="action-link action-delete">删除</a>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
        {% else %}
        <div class="empty-state">
            <div class="empty-icon">📚</div>
            <p class="empty-text">暂无藏书，快去添加第一本吧！</p>
        </div>
        {% endif %}

        <footer>
            <p>My Book Collection &copy; 2026</p>
        </footer>
    </div>
</body>

</html>
