<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的图书馆 | My Library</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Source+Sans+Pro:wght@300;400;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --navy: #1a1a2e;
            --gold: #d4a373;
            --cream: #fefae0;
            --dark-cream: #e9e5d6;
            --shadow: rgba(26, 26, 46, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Source Sans Pro', sans-serif;
            background: var(--navy);
            min-height: 100vh;
            color: var(--cream);
            overflow-x: hidden;
        }

        /* Hero Section */
        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 24px;
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at center, rgba(212, 163, 115, 0.08) 0%, transparent 50%);
            animation: rotate 20s linear infinite;
        }

        @keyframes rotate {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .hero-content {
            position: relative;
            z-index: 1;
        }

        .logo {
            font-size: 5rem;
            margin-bottom: 24px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 4rem;
            font-weight: 700;
            letter-spacing: 4px;
            margin-bottom: 16px;
            animation: fadeInUp 1s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .subtitle {
            font-size: 1.3rem;
            color: var(--gold);
            letter-spacing: 8px;
            text-transform: uppercase;
            font-weight: 300;
            margin-bottom: 48px;
            animation: fadeInUp 1s ease-out 0.2s both;
        }

        .divider {
            width: 100px;
            height: 2px;
            background: var(--gold);
            margin: 0 auto 48px;
            animation: expand 1s ease-out 0.4s both;
        }

        @keyframes expand {
            from {
                width: 0;
                opacity: 0;
            }

            to {
                width: 100px;
                opacity: 1;
            }
        }

        .description {
            max-width: 600px;
            font-size: 1.1rem;
            line-height: 1.8;
            opacity: 0.8;
            margin-bottom: 56px;
            animation: fadeInUp 1s ease-out 0.6s both;
        }

        /* Navigation Cards */
        .nav-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 24px;
            max-width: 700px;
            width: 100%;
            animation: fadeInUp 1s ease-out 0.8s both;
        }

        .nav-card {
            background: rgba(254, 250, 224, 0.05);
            border: 1px solid rgba(212, 163, 115, 0.2);
            border-radius: 12px;
            padding: 32px 24px;
            text-decoration: none;
            color: var(--cream);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .nav-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--gold) 0%, transparent 100%);
            opacity: 0;
            transition: opacity 0.4s;
        }

        .nav-card:hover {
            transform: translateY(-8px);
            border-color: var(--gold);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .nav-card:hover::before {
            opacity: 0.1;
        }

        .nav-card-icon {
            font-size: 2.5rem;
            margin-bottom: 16px;
            display: block;
        }

        .nav-card-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 8px;
            position: relative;
            z-index: 1;
        }

        .nav-card-desc {
            font-size: 0.9rem;
            opacity: 0.6;
            position: relative;
            z-index: 1;
        }

        /* Stats Section */
        .stats {
            display: flex;
            justify-content: center;
            gap: 60px;
            margin-top: 80px;
            padding-top: 40px;
            border-top: 1px solid rgba(212, 163, 115, 0.2);
            animation: fadeInUp 1s ease-out 1s both;
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            font-weight: 700;
            color: var(--gold);
        }

        .stat-label {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0.6;
            margin-top: 8px;
        }

        /* Footer */
        .footer {
            position: absolute;
            bottom: 24px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 0.85rem;
            opacity: 0.4;
        }

        /* Responsive */
        @media (max-width: 768px) {
            h1 {
                font-size: 2.5rem;
            }

            .subtitle {
                font-size: 1rem;
                letter-spacing: 4px;
            }

            .logo {
                font-size: 3.5rem;
            }

            .stats {
                gap: 30px;
            }

            .stat-number {
                font-size: 2rem;
            }
        }
    </style>
</head>

<body>
    <section class="hero">
        <div class="hero-content">
            <div class="logo">📚</div>
            <h1>我的图书馆</h1>
            <p class="subtitle">My Personal Library</p>
            <div class="divider"></div>
            <p class="description">
                欢迎来到我的私人藏书馆。在这里，您可以管理您的书籍收藏，
                添加新书，浏览已有藏书，享受阅读的乐趣。
            </p>

            <div class="nav-cards">
                <a href="/books/list/" class="nav-card">
                    <span class="nav-card-icon">📖</span>
                    <h3 class="nav-card-title">浏览藏书</h3>
                    <p class="nav-card-desc">查看所有书籍</p>
                </a>
                <a href="/books/add/" class="nav-card">
                    <span class="nav-card-icon">✨</span>
                    <h3 class="nav-card-title">添加新书</h3>
                    <p class="nav-card-desc">记录新的收藏</p>
                </a>
                <a href="/books/query/" class="nav-card">
                    <span class="nav-card-icon">🔍</span>
                    <h3 class="nav-card-title">查询数据</h3>
                    <p class="nav-card-desc">搜索与筛选</p>
                </a>
            </div>

            <div class="stats">
                <div class="stat-item">
                    <div class="stat-number">{{ book_count }}</div>
                    <div class="stat-label">藏书总数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number">{{ author_count }}</div>
                    <div class="stat-label">作者数量</div>
                </div>
            </div>
        </div>

        <div class="footer">
            <p>© 2026 My Library. Built with Django & ❤️</p>
        </div>
    </section>
</body>

</html>
